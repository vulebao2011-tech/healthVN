      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        user-select: none; /* Ngăn bôi đen để giống app thật */
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #root {
        height: 100vh;
        overflow-y: auto;
      }
      /* Khu vực để kéo cửa sổ trên macOS (nếu dùng hiddenInset) */

        -webkit-app-region: drag;
      }
      button, input, select {
        -webkit-app-region: no-drag;
      }
      /* Tùy chỉnh thanh cuộn kiểu macOS */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
        border: 2px solid #f8fafc;
      }
